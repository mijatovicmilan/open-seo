services:
  open-seo:
    image: ${OPEN_SEO_IMAGE:-ghcr.io/every-app/open-seo:latest}
    restart: unless-stopped
    # Forward EVERY .env value into the container. The explicit `environment:`
    # list below still wins for the values it names — without this, any .env
    # value not listed there (e.g. OPENROUTER_API_KEY) silently never reached
    # the app. Compose errors if .env is missing; the quickstart's
    # `cp .env.example .env` creates it.
    env_file:
      - .env
    # Anonymous usage heartbeat controls: docs/SELF_HOSTING_DOCKER_LEGACY.md#telemetry
    environment:
      # Required for local Docker self-hosting: exposes Compose env vars to cloudflare:workers bindings.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - ALLOWED_HOST=${ALLOWED_HOST:-}
      - AUTH_MODE=local_noauth
      - OPENSEO_TELEMETRY_DISABLED=${OPENSEO_TELEMETRY_DISABLED:-}
      - DO_NOT_TRACK=${DO_NOT_TRACK:-}
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      # Optional: buy DataForSEO calls through treg.to instead of your own key.
      - TREG_API_TOKEN=${TREG_API_TOKEN:-}
      # Optional: AI features (the SAM agent). Without this the setup
      # gate in the app asks for the key, but nothing here would forward it.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Optional: Google Search Console. See
      # docs/SELF_HOSTING_GOOGLE_SEARCH_CONSOLE.md
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      # Optional: AI features (SAM, the in-app SEO agent)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # Fork addition (FORK-CHANGES.md): PostHog key fallback (keys are
      # normally connected per project in the app, stored encrypted).
      - POSTHOG_PERSONAL_API_KEY=${POSTHOG_PERSONAL_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-}
      - VITE_SHOW_DEVTOOLS=false
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - open_seo_data:/app/.wrangler
  # Fork addition (FORK-CHANGES.md): `vite preview` never fires Cloudflare's
  # cron triggers, so this calls the app's internal cron endpoint every 5
  # minutes (outreach sending, rank checks) and once a day the daily job
  # (Search Console sync). Idle until OPENSEO_CRON_SECRET is set in .env.
  scheduler:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - open-seo
    env_file:
      - .env
    environment:
      - APP_PORT=${PORT:-3001}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$OPENSEO_CRON_SECRET" ]; then
          echo "OPENSEO_CRON_SECRET is not set; the scheduler stays idle."
          while true; do sleep 3600; done
        fi
        url="http://open-seo:$$APP_PORT/api/internal/cron"
        call() {
          curl -fsS -m 240 -o /dev/null -X POST -H "Host: localhost" \
            -H "Authorization: Bearer $$OPENSEO_CRON_SECRET" "$$url$$1"
        }
        daily=""
        sleep 30
        while true; do
          call "" || echo "$$(date -u +%FT%TZ) scheduler call failed"
          today=$$(date -u +%F)
          if [ "$$daily" != "$$today" ]; then
            call "?cron=17%203%20*%20*%20*" && daily=$$today
          fi
          sleep 300
        done
volumes:
  open_seo_data:
